<div className="flex flex-col items-end shrink-0">
    <div className="text-sm font-semibold mb-1 flex items-center gap-2">
        {isFullyComplete && <Icons.CheckCircle className="w-4 h-4 text-green-500" />}
        <span className={isFullyComplete ? 'text-green-600' : 'text-slate-600'}>
            {progress.completionPercent}% Mastered ({progress.earned}/{progress.totalWeight} pts)
        </span>
    </div>
    <div className="w-32 bg-slate-200 h-2 rounded-full overflow-hidden">
        <div 
            className={`h-full transition-all duration-300 ${isFullyComplete ? 'bg-green-500' : 'bg-blue-500'}`}
            style={{ width: `${progress.completionPercent}%` }}
        ></div>
    </div>
</div>
