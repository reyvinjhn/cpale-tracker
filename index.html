<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPALE Review Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel to translate React JSX code in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Version 11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- PASTE YOUR NEW FIREBASE KEYS HERE ---
        const firebaseConfig = {
            apiKey: "YOUR_NEW_API_KEY",
            authDomain: "YOUR_NEW_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_NEW_PROJECT_ID",
            storageBucket: "YOUR_NEW_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_NEW_SENDER_ID",
            appId: "YOUR_NEW_APP_ID"
        };

        const app = initializeApp(firebaseConfig);

        window.firebaseApp = app;
        window.firebaseAuth = { authInstance: getAuth(app), signInAnonymously, onAuthStateChanged };
        window.firebaseDb = { dbInstance: getFirestore(app), doc, setDoc, onSnapshot };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Book: () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-400"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>,
            CheckCircle: ({className="w-4 h-4"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            BarChart: ({className="w-4 h-4"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
            ChevronDown: ({className="w-5 h-5"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>,
            ChevronRight: ({className="w-5 h-5"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"/></svg>,
            CheckSquare: ({className="w-5 h-5"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Square: ({className="w-5 h-5"}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
        };

        const syllabusData = {
            FAR: {
                title: "Financial Accounting and Reporting (FAR)",
                items: 70,
                topics: [
                    { id: "far-1", name: "Non-financial Assets (PPE, Intangibles, Inv. Prop., Bio. Assets)", weight: 20.00, items: 14, subtopics: ["PPE (PAS 16): Initial measurement", "PPE (PAS 16): Subsequent measurement (cost vs revaluation model)", "PPE (PAS 16): Depreciation methods and computation", "PPE (PAS 16): Derecognition", "Intangibles (PAS 38): Internally generated vs acquired", "Intangibles (PAS 38): Amortization", "Investment Property (PAS 40): Cost vs fair value model", "Impairment of Assets (PAS 36): Cash-generating units", "Impairment of Assets (PAS 36): Reversal of impairment", "Biological Assets (PAS 41): Initial fair value measurement", "Biological Assets (PAS 41): Subsequent fair value measurement"] },
                    { id: "far-2", name: "Cash & Other Financial Assets", weight: 14.29, items: 10, subtopics: ["Cash and cash equivalents composition", "Bank reconciliation computation", "Petty cash fund accounting", "Receivables: Initial measurement", "Receivables: Allowance for doubtful accounts computation", "Receivables: Notes receivable discounting", "Investments (PFRS 9): Classification (Amortized Cost, FVOCI, FVTPL)", "Investments (PFRS 9): Expected Credit Loss (ECL) model", "Investments (PFRS 9): Debt vs Equity investments accounting"] },
                    { id: "far-3", name: "Shareholders' Equity", weight: 14.29, items: 10, subtopics: ["Share capital: Issuance and Share issue costs", "Share capital: Subscription and Retirement of shares", "Treasury shares: Cost method accounting", "Retained earnings: Appropriated vs unappropriated", "Retained earnings: Prior period errors adjustments", "Dividends: Cash, Property, Share, Liquidating, Scrip", "Computations: Book value per share", "Computations: Basic EPS (PAS 33)", "Computations: Diluted EPS (PAS 33)"] }
                ]
            }
        };

        const App = () => {
            const [activeSubject, setActiveSubject] = useState('FAR');
            const [subtopicStatus, setSubtopicStatus] = useState({});
            const [expandedTopics, setExpandedTopics] = useState({});
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => {
                if (!window.firebaseApp || !window.firebaseAuth || !window.firebaseDb) return;
                try {
                    const app = window.firebaseApp;
                    const auth = window.firebaseAuth.authInstance;
                    const firestoreDb = window.firebaseDb.dbInstance;
                    setDb(firestoreDb);

                    window.firebaseAuth.signInAnonymously(auth).catch(err => console.error("Auth error:", err));
                    const unsubscribeAuth = window.firebaseAuth.onAuthStateChanged(auth, u => setUser(u));
                    return () => unsubscribeAuth();
                } catch (e) {
                    console.error("Init error:", e);
                }
            }, []);

            useEffect(() => {
                if (!db) {
                    const saved = localStorage.getItem('cpaleProgressLocal');
                    if (saved) setSubtopicStatus(JSON.parse(saved));
                    return;
                }

                setIsSyncing(true);
                const docRef = window.firebaseDb.doc(db, 'trackers', 'SHARED_TRACKER_ID');
                
                const unsubscribe = window.firebaseDb.onSnapshot(docRef, docSnap => {
                    if (docSnap.exists()) {
                        setSubtopicStatus(docSnap.data().status || {});
                    }
                    setIsSyncing(false);
                }, err => {
                    console.error("Sync error:", err);
                    setIsSyncing(false);
                });

                return () => unsubscribe();
            }, [db]);

            const toggleSubtopic = async (topicId, subtopicIndex) => {
                const key = `${topicId}-${subtopicIndex}`;
                const newStatus = { ...subtopicStatus, [key]: !subtopicStatus[key] };
                setSubtopicStatus(newStatus);
                localStorage.setItem('cpaleProgressLocal', JSON.stringify(newStatus));

                if (db) {
                    setIsSyncing(true);
                    try {
                        const docRef = window.firebaseDb.doc(db, 'trackers', 'SHARED_TRACKER_ID');
                        await window.firebaseDb.setDoc(docRef, { status: newStatus }, { merge: true });
                    } catch (e) {
                        console.error("Save error:", e);
                    } finally {
                        setIsSyncing(false);
                    }
                }
            };

            const toggleTopicExpand = (topicId) => {
                setExpandedTopics(prev => ({ ...prev, [topicId]: !prev[topicId] }));
            };

            return (
                <div className="min-h-screen flex flex-col p-6 max-w-4xl mx-auto">
                    <header className="mb-6 flex justify-between items-center">
                        <h1 className="text-2xl font-bold">CPALE Review Tracker (Fresh Sync)</h1>
                        <span className="text-xs bg-slate-200 px-3 py-1 rounded">
                            {isSyncing ? "Syncing..." : user ? "Cloud Connected" : "Local Only"}
                        </span>
                    </header>

                    <div className="space-y-4">
                        {syllabusData.FAR.topics.map((topic, index) => {
                            const isExpanded = expandedTopics[topic.id];
                            return (
                                <div key={topic.id} className="bg-white border rounded-xl p-4 shadow-sm">
                                    <div className="flex justify-between cursor-pointer font-bold" onClick={() => toggleTopicExpand(topic.id)}>
                                        <span>{topic.name}</span>
                                        <span>{isExpanded ? "▼" : "▶"}</span>
                                    </div>
                                    {isExpanded && (
                                        <div className="mt-4 space-y-2 border-t pt-3">
                                            {topic.subtopics.map((sub, subIdx) => {
                                                const isChecked = subtopicStatus[`${topic.id}-${subIdx}`] || false;
                                                return (
                                                    <div key={subIdx} className="flex items-center gap-3 cursor-pointer" onClick={() => toggleSubtopic(topic.id, subIdx)}>
                                                        <span className={isChecked ? "text-green-600 font-bold" : "text-slate-400"}>
                                                            {isChecked ? "☑" : "☐"}
                                                        </span>
                                                        <span className={isChecked ? "line-through text-slate-400" : "text-slate-700"}>{sub}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
