<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPALE Review Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Expose Firebase modules to window so React can use them
        window.firebaseApp = initializeApp;
        window.firebaseAuth = { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken };
        window.firebaseDb = { getFirestore, doc, getDoc, setDoc, updateDoc };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const syllabusData = {
            FAR: {
                title: "Financial Accounting and Reporting (FAR)",
                items: 70,
                topics: [
                    { 
                        id: "far-1", 
                        name: "Non-financial Assets", 
                        weight: 20.00, 
                        items: 14, 
                        subtopics: [
                            "PPE (PAS 16): Initial measurement",
                            "PPE (PAS 16): Subsequent measurement",
                            "PPE (PAS 16): Depreciation methods",
                            "PPE (PAS 16): Derecognition",
                            "Intangibles (PAS 38): General rules",
                            "Intangibles (PAS 38): Amortization",
                            "Investment Property (PAS 40)",
                            "Impairment of Assets (PAS 36)",
                            "Biological Assets (PAS 41)"
                        ] 
                    },
                    { 
                        id: "far-2", 
                        name: "Cash & Other Financial Assets", 
                        weight: 14.29, 
                        items: 10, 
                        subtopics: [
                            "Cash and cash equivalents",
                            "Bank reconciliation",
                            "Petty cash fund",
                            "Receivables: Measurement & Allowance",
                            "Receivables: Notes receivable",
                            "Investments (PFRS 9): Classification",
                            "Investments (PFRS 9): Expected Credit Loss"
                        ] 
                    },
                    { 
                        id: "far-3", 
                        name: "Shareholders' Equity", 
                        weight: 14.29, 
                        items: 10, 
                        subtopics: [
                            "Share capital operations",
                            "Treasury shares",
                            "Retained earnings & Dividends",
                            "Computations: Book value per share",
                            "Computations: Basic & Diluted EPS (PAS 33)"
                        ] 
                    }
                ]
            },
            AFAR: {
                title: "Advanced Financial Accounting (AFAR)",
                items: 70,
                topics: [
                    {
                        id: "afar-1",
                        name: "Partnership Accounting",
                        weight: 14.29,
                        items: 10,
                        subtopics: [
                            "Formation & Operations",
                            "Dissolution (Admission/Withdrawal)",
                            "Liquidation (Lump-sum & Installment)"
                        ]
                    },
                    {
                        id: "afar-2",
                        name: "Revenue Recognition (PFRS 15)",
                        weight: 14.29,
                        items: 10,
                        subtopics: [
                            "5-step model application",
                            "Long-term construction contracts",
                            "Franchise operations",
                            "Consignment & Bill-and-hold"
                        ]
                    }
                ]
            }
            // Note: Truncated for brevity in this example. You would include all your data here.
        };

        // Ensure topics are sorted by weight
        Object.keys(syllabusData).forEach(subjectKey => {
            syllabusData[subjectKey].topics.sort((a, b) => b.weight - a.weight);
        });

        const App = () => {
            const [activeSubject, setActiveSubject] = useState('FAR');
            const [subtopicStatus, setSubtopicStatus] = useState({});
            const [expandedTopics, setExpandedTopics] = useState({});
            
            // Firebase State
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [appId, setAppId] = useState('cpale-tracker-default');

            useEffect(() => {
                // Initialize Firebase once modules are loaded globally
                if (!window.firebaseApp || !window.firebaseAuth || !window.firebaseDb) return;

                // Provide a default config if the environment variable isn't set
                const configString = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
                let firebaseConfig = {};
                try {
                    firebaseConfig = JSON.parse(configString);
                } catch(e) {
                    console.warn("Invalid Firebase config provided");
                    return;
                }
                
                // Set App ID
                const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-cpale-app';
                setAppId(currentAppId);

                try {
                    const app = window.firebaseApp(firebaseConfig);
                    const auth = window.firebaseAuth.getAuth(app);
                    const firestoreDb = window.firebaseDb.getFirestore(app);
                    setDb(firestoreDb);

                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await window.firebaseAuth.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await window.firebaseAuth.signInAnonymously(auth);
                            }
                        } catch (error) {
                            console.error("Auth error:", error);
                        }
                    };
                    
                    initAuth();

                    const unsubscribe = window.firebaseAuth.onAuthStateChanged(auth, (currentUser) => {
                        setUser(currentUser);
                    });

                    return () => unsubscribe();
                } catch (error) {
                    console.error("Firebase init error:", error);
                }
            }, []);

            useEffect(() => {
                const fetchProgress = async () => {
                    if (!user || !db) return;
                    
                    setIsSyncing(true);
                    try {
                        const docRef = window.firebaseDb.doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'trackerState');
                        const docSnap = await window.firebaseDb.getDoc(docRef);
                        
                        if (docSnap.exists()) {
                            setSubtopicStatus(docSnap.data().status || {});
                        }
                    } catch (error) {
                        console.error("Error fetching progress:", error);
                    } finally {
                        setIsSyncing(false);
                    }
                };

                fetchProgress();

                // Default expand the first topic of the active subject
                if (syllabusData[activeSubject] && syllabusData[activeSubject].topics.length > 0) {
                    setExpandedTopics({ [syllabusData[activeSubject].topics[0].id]: true });
                }
            }, [user, db, appId]);

            const toggleSubtopic = async (topicId, subtopicIndex) => {
                const key = `${topicId}-${subtopicIndex}`;
                const newStatus = { ...subtopicStatus, [key]: !subtopicStatus[key] };
                setSubtopicStatus(newStatus);
                
                // Save to Firebase immediately
                if (user && db) {
                    setIsSyncing(true);
                    try {
                        const docRef = window.firebaseDb.doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'trackerState');
                        await window.firebaseDb.setDoc(docRef, { status: newStatus }, { merge: true });
                    } catch (error) {
                        console.error("Error saving progress:", error);
                    } finally {
                        setIsSyncing(false);
                    }
                }
            };

            const toggleTopicExpand = (topicId) => {
                setExpandedTopics(prev => ({ ...prev, [topicId]: !prev[topicId] }));
            };

            // Calculate progress for a specific topic
            const getTopicProgress = (topic) => {
                if (!topic.subtopics || topic.subtopics.length === 0) return { completed: 0, total: 0, percentage: 0 };
                let completedCount = 0;
                topic.subtopics.forEach((_, index) => {
                    if (subtopicStatus[`${topic.id}-${index}`]) completedCount++;
                });
                return {
                    completed: completedCount,
                    total: topic.subtopics.length,
                    percentage: Math.round((completedCount / topic.subtopics.length) * 100)
                };
            };

            // Calculate progress for the entire subject
            const getSubjectProgress = (subjectKey) => {
                const subject = syllabusData[subjectKey];
                let totalSubtopics = 0;
                let completedSubtopics = 0;

                subject.topics.forEach(topic => {
                    if (topic.subtopics) {
                        totalSubtopics += topic.subtopics.length;
                        topic.subtopics.forEach((_, index) => {
                            if (subtopicStatus[`${topic.id}-${index}`]) completedSubtopics++;
                        });
                    }
                });

                if (totalSubtopics === 0) return 0;
                return Math.round((completedSubtopics / totalSubtopics) * 100);
            };

            const getPriorityColor = (weight) => {
                if (weight >= 15) return 'bg-red-500 text-white';
                if (weight >= 10) return 'bg-orange-500 text-white';
                if (weight >= 5) return 'bg-yellow-500 text-slate-900';
                return 'bg-blue-500 text-white';
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-slate-900 text-white p-6 shadow-md">
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between">
                            <div className="flex items-center gap-3 mb-4 md:mb-0">
                                <div>
                                    <h1 className="text-2xl font-bold tracking-tight">CPALE Review Tracker</h1>
                                    <div className="flex items-center gap-2">
                                        <p className="text-slate-400 text-sm">Target: October 2026</p>
                                        {isSyncing && <span className="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded animate-pulse">Syncing...</span>}
                                        {user && !isSyncing && <span className="text-xs bg-green-500/20 text-green-300 px-2 py-0.5 rounded">Saved to Cloud</span>}
                                    </div>
                                </div>
                            </div>
                            
                            {/* Overall Progress Summary */}
                            <div className="flex gap-4 overflow-x-auto pb-2 md:pb-0 w-full md:w-auto justify-start md:justify-end">
                                {Object.keys(syllabusData).map(key => (
                                    <div key={key} className="flex flex-col items-center shrink-0">
                                        <div className="text-xs text-slate-400 font-bold mb-1">{key}</div>
                                        <div className="w-10 h-10 rounded-full border-4 border-slate-700 flex items-center justify-center relative">
                                            <svg className="w-full h-full absolute top-0 left-0 -rotate-90" viewBox="0 0 36 36">
                                                <path
                                                    className="text-blue-500"
                                                    strokeDasharray={`${getSubjectProgress(key)}, 100`}
                                                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                                    fill="none"
                                                    stroke="currentColor"
                                                    strokeWidth="4"
                                                />
                                            </svg>
                                            <span className="text-[10px] font-bold relative z-10">{getSubjectProgress(key)}%</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col md:flex-row gap-6">
                        
                        {/* Sidebar - Subject Navigation */}
                        <aside className="w-full md:w-64 shrink-0">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden sticky top-6">
                                <div className="p-4 bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">
                                    Subjects
                                </div>
                                <nav className="flex flex-col">
                                    {Object.keys(syllabusData).map((key) => (
                                        <button
                                            key={key}
                                            onClick={() => {
                                                setActiveSubject(key);
                                                if (syllabusData[key].topics.length > 0) {
                                                    setExpandedTopics({ [syllabusData[key].topics[0].id]: true });
                                                }
                                            }}
                                            className={`text-left p-4 border-b border-slate-100 transition-colors flex justify-between items-center ${
                                                activeSubject === key 
                                                    ? 'bg-blue-50 border-l-4 border-l-blue-600 text-blue-700 font-medium' 
                                                    : 'hover:bg-slate-50 text-slate-600'
                                            }`}
                                        >
                                            <span>{key}</span>
                                            <span className="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full font-bold">
                                                {getSubjectProgress(key)}%
                                            </span>
                                        </button>
                                    ))}
                                </nav>
                            </div>
                        </aside>

                        {/* Content Area - Topic List with Checklists */}
                        <section className="flex-1">
                            <div className="mb-6">
                                <h2 className="text-3xl font-bold text-slate-900 mb-2">{syllabusData[activeSubject].title}</h2>
                                <div className="flex gap-4 text-sm text-slate-500">
                                    <span>Total Items: {syllabusData[activeSubject].items}</span>
                                    <span>Sorted by Exam Weight</span>
                                </div>
                                
                                {/* Subject Progress Bar */}
                                <div className="mt-4 bg-slate-200 h-2 rounded-full overflow-hidden">
                                    <div 
                                        className="bg-blue-600 h-full transition-all duration-500" 
                                        style={{ width: `${getSubjectProgress(activeSubject)}%` }}
                                    ></div>
                                </div>
                            </div>

                            <div className="space-y-4">
                                {syllabusData[activeSubject].topics.map((topic, index) => {
                                    const progress = getTopicProgress(topic);
                                    const isExpanded = expandedTopics[topic.id];
                                    const isFullyComplete = progress.percentage === 100 && progress.total > 0;

                                    return (
                                        <div key={topic.id} className={`bg-white rounded-xl shadow-sm border transition-all ${isFullyComplete ? 'border-green-300 bg-green-50/30' : 'border-slate-200'}`}>
                                            {/* Topic Header (Clickable to expand) */}
                                            <div 
                                                className="p-5 cursor-pointer hover:bg-slate-50 transition-colors rounded-t-xl"
                                                onClick={() => toggleTopicExpand(topic.id)}
                                            >
                                                <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
                                                    
                                                    {/* Left: Title & Priority */}
                                                    <div className="flex-1 flex gap-3">
                                                        <div className="mt-1 flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-500">
                                                            {isExpanded ? '-' : '+'}
                                                        </div>
                                                        <div>
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <span className="text-slate-400 font-mono text-sm">#{index + 1}</span>
                                                                <h3 className={`font-bold text-lg ${isFullyComplete ? 'text-green-800' : 'text-slate-800'}`}>
                                                                    {topic.name}
                                                                </h3>
                                                            </div>
                                                            
                                                            <div className="flex flex-wrap gap-2 text-xs mb-3">
                                                                <span className={`px-2 py-1 rounded-md font-semibold ${getPriorityColor(topic.weight)}`}>
                                                                    Weight: {topic.weight.toFixed(2)}%
                                                                </span>
                                                                <span className="px-2 py-1 rounded-md bg-slate-100 text-slate-600 border border-slate-200">
                                                                    Est. Items: {topic.items}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    {/* Right: Progress Indicator */}
                                                    <div className="flex flex-col items-end shrink-0">
                                                        <div className="text-sm font-semibold mb-1 flex items-center gap-2">
                                                            <span className={isFullyComplete ? 'text-green-600' : 'text-slate-600'}>
                                                                {progress.completed} / {progress.total} completed
                                                            </span>
                                                        </div>
                                                        <div className="w-32 bg-slate-200 h-2 rounded-full overflow-hidden">
                                                            <div 
                                                                className={`h-full transition-all duration-300 ${isFullyComplete ? 'bg-green-500' : 'bg-blue-500'}`}
                                                                style={{ width: `${progress.percentage}%` }}
                                                            ></div>
                                                        </div>
                                                    </div>

                                                </div>
                                            </div>

                                            {/* Topic Body (Checklist) */}
                                            {isExpanded && topic.subtopics && (
                                                <div className="border-t border-slate-100 p-5 bg-slate-50/50 rounded-b-xl">
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3">
                                                        {topic.subtopics.map((subtopic, subIdx) => {
                                                            const isChecked = subtopicStatus[`${topic.id}-${subIdx}`] || false;
                                                            return (
                                                                <div 
                                                                    key={subIdx} 
                                                                    className={`flex items-start gap-3 p-2 rounded-lg cursor-pointer transition-colors ${isChecked ? 'bg-green-100/50' : 'hover:bg-slate-100'}`}
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        toggleSubtopic(topic.id, subIdx);
                                                                    }}
                                                                >
                                                                    <div className="mt-0.5 shrink-0 flex items-center justify-center w-5 h-5 rounded border-2 border-slate-300 text-white data-[checked=true]:bg-green-500 data-[checked=true]:border-green-500" data-checked={isChecked}>
                                                                        {isChecked && (
                                                                           <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                                        )}
                                                                    </div>
                                                                    <span className={`text-sm leading-snug select-none ${isChecked ? 'text-slate-500 line-through' : 'text-slate-700'}`}>
                                                                        {subtopic}
                                                                    </span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}

                                        </div>
                                    );
                                })}
                            </div>
                        </section>
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 py-6 text-center text-slate-400 text-sm mt-auto">
                        <p>Based on BOA Resolution No. 30, Series of 2022 (Applicable for May & October 2026 CPALE)</p>
                        {user ? (
                            <p className="mt-1 text-green-400">Status: Connected to Cloud (User ID: {user.uid.substring(0,6)}...)</p>
                        ) : (
                            <p className="mt-1 text-yellow-400">Connecting to cloud storage...</p>
                        )}
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        // Initialize lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
